<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Test Readiness-Check</title><link rel="stylesheet" href="../app.css"><meta name="viewport" content="width=device-width, initial-scale=1"><style>pre{white-space:pre-wrap;word-break:break-word}</style></head>
<body>
<header class="kopf"><div class="objektwahl"><select id="objSel"></select><button id="btnNeu" type="button">+</button></div></header>
<nav class="tabs" id="tabs"><button data-tab="objekt">1</button><button data-tab="funktionen">2</button><button data-tab="faeh">3</button><button data-tab="auswertung">4</button><button data-tab="daten">5</button></nav>
<main id="main"><section id="tab-objekt" class="tab"></section><section id="tab-funktionen" class="tab"></section><section id="tab-faeh" class="tab"></section><section id="tab-auswertung" class="tab"></section><section id="tab-daten" class="tab"></section></main>
<p id="versionInfo"></p><div id="toast"></div>
<script>try{localStorage.removeItem('techne-rc-v1');}catch(e){}</script>
<script src="../katalog.js"></script>
<script src="../app.js"></script>
<script>
(function(){
  var R=[], T=window.RC_TEST, K=window.KATALOG;
  function ok(name, cond, info){ R.push((cond?'OK   ':'FEHL ')+name+(info!==undefined?' -> '+JSON.stringify(info):'')); }
  try{
    ok('Katalog 45 Funktionen', K.funktionen.length===45, K.funktionen.length);
    var ohneZiel=K.funktionen.filter(function(f){return !T.bZiel(f);}).map(function(f){return f.id;});
    ok('jede Funktion hat B-Ziel', ohneZiel.length===0, ohneZiel);
    var f=function(id){return K.funktionen.filter(function(x){return x.id===id;})[0];};
    ok('B-Ziel 1.4a = Typ 4 ohne B-Stufe', T.bZiel(f('1.4a')).t.nr==='4' && T.bZiel(f('1.4a')).ohneB);
    ok('B-Ziel 1.1 = Typ 3 mit B-Stufe', T.bZiel(f('1.1')).t.nr==='3' && !T.bZiel(f('1.1')).ohneB);
    ok('B-Ziel 4.1 = Typ 1', T.bZiel(f('4.1')).t.nr==='1');
    ok('leerer Start zeigt Hinweis', document.querySelector('#tab-objekt').textContent.indexOf('Noch kein Objekt')>=0);
    var o=T.neu('Testhotel'); T.render();
    o.heiz='320'; ok('320 kW -> Stufe 290', T.betroffenheit(o).stufe==='290');
    o.heiz='100'; o.kaelte=''; ok('100 kW -> Stufe 70', T.betroffenheit(o).stufe==='70');
    o.heiz='60'; o.kaelte='30'; ok('60+30 -> klaeren', T.betroffenheit(o).stufe==='klaeren');
    o.heiz='200'; o.kaelte='150'; var b=T.betroffenheit(o); ok('200/150 -> 70 + Summenhinweis', b.stufe==='70' && b.text.join(' ').indexOf('zusammen über 290')>=0);
    o.heiz='50'; o.kaelte='10'; ok('50/10 -> unter', T.betroffenheit(o).stufe==='unter');
    o.heiz='320'; o.land='B'; ok('Land Bgld geladen', T.betroffenheit(o).land.name==='Burgenland');
    o.f['1.1']={typ:'2'}; o.f['1.4a']={typ:'1'}; o.f['5.1']={typ:'1'}; o.f['7.3']={typ:'1'};
    var a=T.auswertung(o);
    ok('Gesamt D bei 1.4a statisch', a.min===1, a.min);
    ok('Lücken enthalten 1.1, 1.4a, 5.1, 7.3', ['1.1','1.4a','5.1','7.3'].every(function(id){return a.luecken.some(function(l){return l.f.id===id;});}), a.luecken.map(function(l){return l.f.id;}));
    o.f['1.4a']={typ:'4'}; o.f['5.1']={typ:'2'}; o.f['1.1']={typ:'3'}; o.f['7.3']={typ:'2'}; a=T.auswertung(o);
    ok('Gesamt B nach Upgrade (1.1 Typ 3 = B)', a.min===3, a.min);
    o.f['1.1']={typ:'3F'}; a=T.auswertung(o); ok('Gesamt A mit 3F', a.min===4, a.min);
    o.aus.K=true; a=T.auswertung(o); ok('Kühlung aus -> 10 Funktionen irrelevant', a.irrel.filter(function(x){return x.f.g==='K';}).length===10);
    o.f['6']={lt5:true}; ok('6 unter 5 % irrelevant', !T.fZustand(o,f('6')).rel);
    o.f['4.4']={typ:'0'}; a=T.auswertung(o); ok('4.4 Typ 0 konservativ D', a.min===1);
    var fa=K.faehigkeiten.filter(function(x){return x.k==='a';})[0];
    ok('Fähigkeit a ungeprüft', T.faehErgebnis(o,fa)==='nicht geprüft');
    fa.punkte.forEach(function(p){o.fa[p.id]={s:'erfüllt'};}); ok('Fähigkeit a erfüllt', T.faehErgebnis(o,fa)==='erfüllt');
    o.fa.a2={s:'nicht erfüllt'}; ok('Fähigkeit a nicht erfüllt', T.faehErgebnis(o,fa)==='nicht erfüllt');
    // UI: Tabs und Auswahl per Ereignis
    ['objekt','funktionen','faeh','auswertung','daten'].forEach(function(t){ document.querySelector('[data-tab="'+t+'"]').click(); ok('Tab '+t+' rendert', document.querySelector('#tab-'+t).innerHTML.length>200); });
    document.querySelector('[data-tab="funktionen"]').click();
    var det=document.querySelector('details.gewerk[data-g="H"]'); det.open=true;
    var r=document.querySelector('input[type=radio][data-f="1.3"][value="1"]');
    ok('Radio 1.3 vorhanden', !!r);
    if(r){ r.checked=true; r.dispatchEvent(new Event('change',{bubbles:true})); }
    ok('Radio setzt Typ 1.3 = 1', T.db().objs[o.id].f['1.3'].typ==='1');
    var cb=document.querySelector('input[data-aus="W"]'); cb.checked=true; cb.dispatchEvent(new Event('change',{bubbles:true}));
    ok('Gewerk W per Klick aus', T.db().objs[o.id].aus.W===true);
    document.querySelector('[data-tab="auswertung"]').click();
    var txt=document.querySelector('#tab-auswertung').textContent;
    ok('Auswertung zeigt Lücken-Überschrift', txt.indexOf('Lücken zu Klasse B')>=0);
    ok('Auswertung zeigt Beleuchtungssteuerung', txt.indexOf('Beleuchtungssteuerung')>=0);
    var gespeichert=JSON.parse(localStorage.getItem('techne-rc-v1')||'null');
    setTimeout(function(){
      var g2=JSON.parse(localStorage.getItem('techne-rc-v1')||'null');
      ok('localStorage gespeichert', !!(g2 && g2.objs && g2.objs[o.id]));
      fertig();
    }, 600);
  }catch(e){ R.push('FEHL Ausnahme: '+e.message+' '+e.stack); fertig(); }
  function fertig(){ var m=location.search.match(/tab=(\w+)/); if(m){ document.querySelector('[data-tab="'+m[1]+'"]').click(); var d=document.querySelector('details.gewerk[data-g="H"]'); if(d) d.open=true; } var p=document.createElement('pre'); p.id='ergebnis'; p.textContent='TESTERGEBNIS\n'+R.join('\n')+'\nSUMME '+R.filter(function(x){return x.indexOf('OK')===0;}).length+'/'+R.length; document.body.appendChild(p); p.textContent+='\nBREITE innerWidth='+innerWidth+' scrollWidth='+document.documentElement.scrollWidth; document.title='FERTIG'; }
})();
</script>
</body></html>
